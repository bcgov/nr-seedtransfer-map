name: Demo Deployment

on:
  pull_request:
    types: [labeled]

concurrency:
  group: gh-pages-state
  cancel-in-progress: false

permissions: {}

jobs:
  deploy-demo:
    name: Deploy Demo Redirect
    if: github.event.label.name == 'DEMO'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - name: Create Demo Redirect
        run: |
          mkdir -p demo-redirect
          cat > demo-redirect/index.html <<'EOF'
          <!doctype html>
          <html style="margin: 0; padding: 0; height: 100%; overflow: hidden;">
          <head>
            <title>Demo Environment</title>
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
            <meta http-equiv="Pragma" content="no-cache" />
            <meta http-equiv="Expires" content="0" />
          </head>
          <body style="margin: 0; padding: 0; height: 100%; overflow: hidden;">
            <iframe src="../pr-${{ github.event.number }}/" style="width: 100%; height: 100%; border: none;" allowfullscreen></iframe>
          </body>
          </html>
          EOF
      - name: Deploy Demo Redirect
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          folder: demo-redirect
          branch: gh-pages
          clean: true
          target-folder: deployments/demo

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEMO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/deployments/demo/"
          gh pr comment ${{ github.event.number }} --body "🚀 **Demo Environment Deployed!**
          
          A stable demo redirect has been created for this PR.
          You can view it here: $DEMO_URL"
