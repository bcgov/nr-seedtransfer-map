name: Merge Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'

concurrency:
  group: gh-pages-state
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    permissions:
      contents: write
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - name: Deploy static content to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          folder: docs
          branch: gh-pages
          clean: true # Cleanup, but leave PR deployments
          clean-exclude: deployments
