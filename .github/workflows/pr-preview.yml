name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy preview content to previews/pr-${{ github.event.number }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          target-folder: previews/pr-${{ github.event.number }}
          clean: false # Do not delete other previews!

      - name: Comment PR with Preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          # Prevent commenting multiple times on sync (check if we already commented)
          EXISTING_COMMENT=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json comments --jq '.comments[].body' | grep "Sandbox Preview Environment Ready!" || true)
          if [ -z "$EXISTING_COMMENT" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "### 🧪 Sandbox Preview Environment Ready!
            
            A temporary sandbox preview of your changes is live at:
            👉 **[View Preview](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/pr-${PR_NUMBER}/index.html)**
            
            _This preview environment will be automatically destroyed when this Pull Request is closed or merged._"
          fi
