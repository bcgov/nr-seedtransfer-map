name: PR Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Workflow-level: per-PR cancellation so rapid pushes don't queue stale runs.
# The deploy job adds its own gh-pages-state lock to serialize gh-pages mutations.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: Lint & Unit Tests
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.diff.outputs.triggered }}
    steps:
      - uses: actions/checkout@v7
      - name: Check for deployable changes
        uses: bcgov/actions/diff-triggers@ac9d89eede94f5f58d3446784c94cff634d98eac # v0.6.0
        id: diff
        with:
          triggers: |
            docs/
            tests/
            scripts/
            package.json
            package-lock.json
            playwright.config.js
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify syntax, formatting & run unit tests
        run: npm run validate

  e2e:
    name: E2E Playwright Tests
    needs: [validate]
    if: needs.validate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Get Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -e 'console.log(require("@playwright/test/package.json").version)')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Chromium & dependencies
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Compile JSON to FlatGeobuf
        run: npm run db:convert
      - name: Run E2E Integration tests
        run: npm run test:e2e

  deploy:
    name: Deploy PR Preview
    needs: [validate, e2e]
    if: needs.validate.outputs.deploy == 'true'
    # Serialize gh-pages mutations across pr-open, pr-close, and merge workflows.
    concurrency:
      group: gh-pages-state
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Prune database if unchanged or compile to FlatGeobuf
        run: |
          git fetch --depth=1 origin main
          # Two-dot diff: HEAD is the PR merge commit, so origin/main..HEAD is the PR's delta.
          # Avoids needing a deep history for a merge-base (triple-dot).
          if git diff --name-only origin/main HEAD | grep -q "^docs/Version_7_0/"; then
            echo "📂 Database changes detected. Keeping full database and compiling to FlatGeobuf."
            npm run db:convert
          else
            echo "⚡ Database is unchanged. Pruning for speed."
            rm -rf docs/Version_7_0
            sed -i 's/<body/<body data-database-pruned="true"/' docs/index.html
          fi
      - name: Deploy to deployments/pr-${{ github.event.number }}
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: docs
          branch: gh-pages
          clean: false # Do not delete other previews!
          target-folder: deployments/pr-${{ github.event.number }}

      - name: 🧪 Smoke Test PR Preview URL
        run: |
          PREVIEW_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/deployments/pr-${{ github.event.number }}/"
          echo "📡 Checking if preview is live at $PREVIEW_URL"
          TIMEOUT=300
          INTERVAL=15
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$PREVIEW_URL" || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Smoke test passed! Preview is live and returning HTTP 200."
              exit 0
            fi
            echo "⏳ Status is $STATUS, retrying in ${INTERVAL}s... ($ELAPSED/$TIMEOUT)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "❌ Timeout reached! Preview environment is not returning HTTP 200."
          exit 1
