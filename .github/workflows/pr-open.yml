name: PR Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - '.github/workflows/pr-open.yml'
      - 'tests/**'
      - 'package*.json'
      - 'playwright.config.js'

# Workflow-level: per-PR cancellation so rapid pushes don't queue stale runs.
# The deploy job adds its own gh-pages-state lock to serialize gh-pages mutations.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: Lint & Unit Tests
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify syntax, formatting & run unit tests
        run: npm run validate

  e2e:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Get Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -e 'console.log(require("@playwright/test/package.json").version)')" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright Chromium & dependencies
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Compile JSON to FlatGeobuf
        run: npm run db:convert
      - name: Run E2E Integration tests
        run: npm run test:e2e

  deploy:
    name: Deploy PR Preview
    needs: [validate, e2e]
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Serialize gh-pages mutations across pr-open, pr-close, and merge workflows.
    concurrency:
      group: gh-pages-state
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Prune database if unchanged or compile to FlatGeobuf
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }}

          # ---------------------------------------------------------------------------
          # TEMPORARY — FORCE_FULL_FGB_DEPLOY (remove after ESRI stack merges to main)
          # ---------------------------------------------------------------------------
          # While the flatgeobuf / ESRI-eviction PR stack is open, PR previews must ship
          # the full compiled database locally. The normal "pruned" path only keeps polygon
          # outlines (Management_Units, Suitable_BEC, Nonsuitable_BEC) and expects seedlot
          # FGB files to load from production root via ../../ — but production gh-pages does
          # not yet run db:convert, and legacy production JSON is being retired.
          #
          # With FORCE_FULL_FGB_DEPLOY=true every PR preview runs npm run db:convert and
          # deploys all FGB files under deployments/pr-{N}/. Slower deploys, but previews
          # work without production fallbacks.
          #
          # WHEN TO REMOVE: delete the FORCE_FULL_FGB_DEPLOY block (set false or remove the
          # variable and the `||` branch) once this stack is on main and merge.yml deploys
          # db:convert output to production gh-pages root. Documented in PR #99.
          # ---------------------------------------------------------------------------
          FORCE_FULL_FGB_DEPLOY=true

          # Two-dot diff against the PR's direct base branch (not main) so stacked PRs
          # only detect DB changes introduced by this specific PR, not the entire stack.
          if [ "$FORCE_FULL_FGB_DEPLOY" = "true" ] || git diff --name-only origin/${{ github.base_ref }} HEAD | grep -E "^docs/Version_7_0/.*_Seedlots\.json|^docs/Version_7_0/.*_migrated_height_list.*\.json|^docs/Version_7_0/Orchard_list\.json|^docs/Version_7_0/Seedlot_list\.json"; then
            echo "📂 Full database deploy: compiling JSON to FlatGeobuf."
            npm run db:convert
            sed -i 's/<body/<body data-full-fgb-deploy="true"/' docs/index.html
          else
            echo "⚡ Database is unchanged. Pruning for speed."
            # Delete database files only, preserving local polygon FlatGeobuf files and bounds mapping.
            # Previews set data-database-pruned on <body>; client code in dataUrl.js keeps
            # polygon FGB local and falls back to ../../ for seedlot assets on production root.
            find docs/Version_7_0 -type f ! -name "Management_Units.fgb" ! -name "Suitable_BEC.fgb" ! -name "Nonsuitable_BEC.fgb" ! -name "bec_bounds.json" -delete
            sed -i 's/<body/<body data-database-pruned="true"/' docs/index.html
          fi
      - name: Deploy to deployments/pr-${{ github.event.number }}
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          folder: docs
          branch: gh-pages
          clean: true # Removes stale files from the target subfolder only — safe because
          # target-folder scopes rsync's --delete to deployments/pr-{N}/, not other PR folders.
          target-folder: deployments/pr-${{ github.event.number }}

      - name: Request GitHub Pages rebuild
        run: gh api -X POST "/repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 🧪 Smoke Test PR Preview URL
        run: |
          PREVIEW_BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/deployments/pr-${{ github.event.number }}"
          echo "📡 Waiting for CDN to serve full preview at $PREVIEW_BASE/"
          TIMEOUT=600
          INTERVAL=15
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            INDEX=$(curl -o /dev/null -s -w "%{http_code}" "$PREVIEW_BASE/" || true)
            FGB=$(curl -o /dev/null -s -w "%{http_code}" "$PREVIEW_BASE/Version_7_0/Pli_Seedlots.fgb" || true)
            if [ "$INDEX" = "200" ] && [ "$FGB" = "200" ]; then
              echo "✅ Preview is live on CDN (index + seedlot FGB both HTTP 200)."
              exit 0
            fi
            echo "⏳ CDN not ready yet (index=$INDEX, Pli_Seedlots.fgb=$FGB). Retrying in ${INTERVAL}s... ($ELAPSED/$TIMEOUT)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "❌ Timeout: CDN did not serve the full preview database at $PREVIEW_BASE/"
          exit 1
